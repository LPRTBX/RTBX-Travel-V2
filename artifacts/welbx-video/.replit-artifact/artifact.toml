kind = "video"
previewPath = "/welbx-video/"
title = "WELBX Explainer Video"
version = "1.0.0"
id = "artifacts/welbx-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/welbx-video/" ]
localPort = 21196

[services.development]
run = "pnpm --filter @workspace/welbx-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/welbx-video", "run", "build" ]
publicDir = "artifacts/welbx-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21196"
BASE_PATH = "/welbx-video/"
