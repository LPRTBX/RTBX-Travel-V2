kind = "web"
previewPath = "/"
title = "JALDO Travel Partner Room"
version = "1.0.0"
id = "artifacts/welbx"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 23549

[services.development]
run = "pnpm --filter @workspace/rtbx-travel run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/rtbx-travel", "run", "build"]

[services.production.run]
args = ["node", "artifacts/welbx/server/start.mjs"]

[services.production.run.env]
PORT = "23549"
NODE_ENV = "production"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "23549"
BASE_PATH = "/"
