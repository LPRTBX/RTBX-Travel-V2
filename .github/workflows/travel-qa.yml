name: RTBX Travel QA

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/welbx/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/welbx/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'

jobs:
  travel-qa:
    name: Travel QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @workspace/rtbx-travel run typecheck

      - name: Lint
        # NOTE: lint script not yet configured (Sprint 1 baseline — deferred to Sprint 2)
        run: pnpm --filter @workspace/rtbx-travel run lint
        continue-on-error: true

      - name: Run tests
        run: pnpm --filter @workspace/rtbx-travel run test

      - name: Check active terminology
        run: pnpm --filter @workspace/rtbx-travel run check:terminology

      - name: Test routes
        run: pnpm --filter @workspace/rtbx-travel run test:routes

      - name: Test internal links
        run: pnpm --filter @workspace/rtbx-travel run test:links

      - name: Check assets
        run: pnpm --filter @workspace/rtbx-travel run check:assets

      - name: Production build
        run: pnpm --filter @workspace/rtbx-travel run build
